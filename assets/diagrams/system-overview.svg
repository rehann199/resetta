<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Resetta system overview</title>
  <desc id="d">A Flutter app with a presentation layer, Riverpod state, pure scoring and domain services, and local Hive storage on the device. The device talks to Firebase services, store billing, an ad mediation SDK and push messaging.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3d322b; }
      .h { font-family: Georgia, "Times New Roman", serif; font-size: 28px; font-weight: 700; }
      .s { font-size: 15px; fill: #6b5d52; }
      .k { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #6b5d52; }
      .t { font-size: 17px; font-weight: 700; }
      .b { font-size: 14px; fill: #4a3e36; }
      .dev { fill: #f6f1e8; stroke: #3d322b; stroke-width: 2.2; }
      .cloud { fill: #f6f1e8; stroke: #1f7f72; stroke-width: 2.2; }
      .layer { fill: #ffffff; stroke: #b9a996; stroke-width: 1.5; }
      .core { fill: #fbe9d9; stroke: #c9631f; stroke-width: 1.8; }
      .store { fill: #e4f1ee; stroke: #1f7f72; stroke-width: 1.5; }
      .line { stroke: #3d322b; stroke-width: 2; fill: none; }
      .teal { stroke: #1f7f72; stroke-width: 2; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d322b"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f7f72"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#e9e0d3"/>
  <text x="40" y="52" class="h">One Flutter codebase, local first</text>
  <text x="40" y="78" class="s">The screens read local state; cloud, billing and ad services sit behind thin service layers.</text>

  <rect x="40" y="104" width="700" height="500" rx="16" class="dev"/>
  <text x="62" y="134" class="k">ON THE DEVICE (ANDROID AND iOS)</text>

  <rect x="64" y="150" width="652" height="76" rx="12" class="layer"/>
  <text x="84" y="178" class="t">Presentation</text>
  <text x="84" y="202" class="b">Illustrated screens, state-themed home backdrops, routing with an onboarding guard</text>

  <rect x="64" y="248" width="652" height="76" rx="12" class="layer"/>
  <text x="84" y="276" class="t">App state</text>
  <text x="84" y="300" class="b">Riverpod providers and notifiers for check-ins, onboarding, settings, premium, auth</text>

  <rect x="64" y="346" width="652" height="104" rx="12" class="core"/>
  <text x="84" y="374" class="t">Domain logic (plain Dart)</text>
  <text x="84" y="398" class="b">Scoring and smoothing, state mapping, dominant driver, day-state resolver,</text>
  <text x="84" y="418" class="b">early signals, recovery schedule and action selection, notification campaigns</text>

  <rect x="64" y="488" width="316" height="100" rx="12" class="store"/>
  <text x="84" y="516" class="t">Local store</text>
  <text x="84" y="540" class="b">Hive boxes: profile, baseline,</text>
  <text x="84" y="560" class="b">daily check-ins, actions, insights,</text>
  <text x="84" y="580" class="b">settings. The UI reads only here.</text>

  <rect x="400" y="488" width="316" height="100" rx="12" class="layer"/>
  <text x="420" y="516" class="t">Platform services</text>
  <text x="420" y="540" class="b">Local reminders, connectivity,</text>
  <text x="420" y="560" class="b">consent prompts, PDF report,</text>
  <text x="420" y="580" class="b">store billing and ad SDK wrappers</text>

  <path class="line" d="M390 226 V244" marker-end="url(#ar)"/>
  <path class="line" d="M390 324 V342" marker-end="url(#ar)"/>
  <path class="line" d="M222 450 V484" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <path class="line" d="M558 450 V484" marker-end="url(#ar)"/>

  <rect x="800" y="104" width="360" height="500" rx="16" class="cloud"/>
  <text x="822" y="134" class="k">CLOUD AND PLATFORM</text>

  <rect x="824" y="150" width="312" height="92" rx="12" class="layer"/>
  <text x="844" y="178" class="t">Firebase Auth + Firestore</text>
  <text x="844" y="202" class="b">Optional account, per-user sync,</text>
  <text x="844" y="222" class="b">offline persistence enabled</text>

  <rect x="824" y="258" width="312" height="92" rx="12" class="layer"/>
  <text x="844" y="286" class="t">Firebase runtime services</text>
  <text x="844" y="310" class="b">Analytics, Crashlytics, Performance,</text>
  <text x="844" y="330" class="b">Remote Config, Cloud Messaging</text>

  <rect x="824" y="366" width="312" height="92" rx="12" class="layer"/>
  <text x="844" y="394" class="t">Store billing</text>
  <text x="844" y="418" class="b">Google Play and App Store</text>
  <text x="844" y="438" class="b">subscriptions, restore on launch</text>

  <rect x="824" y="474" width="312" height="106" rx="12" class="layer"/>
  <text x="844" y="502" class="t">Ad mediation</text>
  <text x="844" y="526" class="b">One mediation SDK, several ad</text>
  <text x="844" y="546" class="b">networks; remote switches per</text>
  <text x="844" y="566" class="b">placement; suppressed for premium</text>

  <path class="teal" d="M716 286 H768 V196 H820" marker-start="url(#at)" marker-end="url(#at)"/>
  <path class="teal" d="M716 304 H820" marker-end="url(#at)"/>
  <path class="teal" d="M716 540 H744 V420 H820" marker-start="url(#at)" marker-end="url(#at)"/>
  <path class="teal" d="M716 568 H776 V527 H820" marker-end="url(#at)"/>
</svg>
